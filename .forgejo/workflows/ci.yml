name: CI
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  # manual re-run path (flaky job, runner was offline, cache experiments)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"
  # One compiler per job, not cargo's nproc (6 on vm-runner-01). The nlink
  # crate's lib test peaks at ~2.9 GB of rustc RSS and its lib at ~2.1 GB,
  # and "2" let a job compile both at once: the four nlink jobs of one push
  # (clippy, test, test-all-features, integration) held 8 compilers, ~12.3 GB,
  # and the runner VM killed one with signal 9 on 1 push in 4 (2026-10-22).
  # "1" does not shrink a rustc, it stops a job holding two; it costs ~70 s
  # per job on the nlink crate. myserver docs/vms/vm-runner.md §Memory.
  CARGO_BUILD_JOBS: "1"
  # Panics keep file:line, the build drops full DWARF. Full debug info made
  # each test job's target/ big enough that two concurrent zenkey runs
  # filled /srv/cache (2026-10-19). vm-dev builds with the same setting.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # No fmt job on purpose: the tree is not rustfmt-clean and the previous CI
  # never enforced formatting. Add one after an explicit `cargo fmt` sweep.
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo clippy --workspace --all-targets --all-features -- --deny warnings
      # Features that pull in serde_json without `output`: every other build
      # here has `output` (default, --all-features), which hid #741.
      - run: cargo check -p nlink --features serde
      - run: cargo check -p nlink --features schemars

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  test-all-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: all-features
          cache-targets: false
      - run: cargo build --workspace --all-targets --all-features
      # nlink's tests/integration.rs needs root/netns — it runs on the
      # privileged lane (integration.yml); everything else runs here.
      - run: cargo test --workspace --all-features --exclude nlink
      - run: cargo test -p nlink --all-features --lib
      # Doc examples compile under every feature too: the `test` job only
      # covers the default set, and 40 of these are feature-gated (#304).
      - run: cargo test -p nlink --all-features --doc

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      # The workspace's rust-version: the oldest stable that builds every
      # target with every feature, raised only in a minor release (#532).
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
          cache-targets: false
      - run: cargo check --workspace --all-targets --all-features

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::redundant_explicit_links
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo doc -p nlink --no-deps --all-features

  # The repo-convention audit scripts: cheap greps, one job.
  audits:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: bash scripts/audit-example-features.sh
      - run: bash scripts/check-readme.sh
      - run: bash scripts/audit-example-registration.sh
      - run: bash scripts/audit-recv-loop-error-handling.sh
      - run: bash scripts/audit-sysfs-in-lib.sh
      # The UAPI audit reads the vendored YNL specs (#167) and fails without PyYAML.
      - run: python3 -c 'import yaml' 2>/dev/null || (sudo apt-get update && sudo apt-get install -y python3-yaml)
      - run: bash scripts/audit-uapi-constants.sh
      - run: bash scripts/test-audit-uapi-constants.sh
      - run: bash scripts/audit-message-accessor-convention.sh
      - run: bash scripts/audit-bytes-le.sh
      - run: bash scripts/audit-ignored-tests.sh
      - run: bash scripts/audit-dump-termination.sh
      - run: bash scripts/audit-socket-io.sh
      - run: bash scripts/audit-send-futures.sh
      - run: bash scripts/audit-doc-examples.sh

  # Supply-chain lint (fleet standard, myserver#33): advisories, licenses,
  # bans, sources — config in deny.toml.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      # the docker cargo-deny action cannot see deny.toml -> install directly
      - uses: https://github.com/taiki-e/install-action@v2.87.7
        with:
          tool: cargo-deny
      - run: cargo deny check

  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/obi1kenobi/cargo-semver-checks-action@v2.9
        with:
          package: nlink

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: cargo install cargo-machete --locked && cargo machete

  big-endian-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y gcc-s390x-linux-gnu
      # @master + explicit toolchain, not @stable: rust-toolchain.toml pins
      # the version, so the s390x target must be installed for *that*
      # toolchain — installing it for floating stable leaves cargo (which
      # honors the file) targetless. Keep this in lockstep with
      # rust-toolchain.toml's channel.
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: s390x-unknown-linux-gnu
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: s390x
          cache-targets: false
      - name: Cross-check on big-endian target
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.s390x-unknown-linux-gnu]
          linker = "s390x-linux-gnu-gcc"
          EOF
          cargo check --target s390x-unknown-linux-gnu -p nlink
