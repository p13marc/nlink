name: Integration
# Privileged runner lane (label `integration`): tests create network
# namespaces, mutate rtnetlink state, and rely on kernel modules preloaded
# on the runner VM (myserver docs/vm-runner.md — /etc/modules-load.d/
# ci-integration.conf). No modprobe in-container; tests skip missing
# modules via require_module!().
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

jobs:
  integration:
    runs-on: integration
    container:
      image: rust:1.97-bookworm
    steps:
      - name: Install runtime deps and node for actions
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends iproute2 conntrack nodejs git
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: Guard that kernel modules are available on the runner VM
        shell: bash
        run: |
          # Same predicate as `nlink::lab::has_module`: loaded, built in,
          # or loadable on demand. `/sys/module` alone is not enough —
          # a built-in publishes a directory there only if it exports
          # parameters, so most do not (#273).
          rel=$(uname -r)
          idx="/lib/modules/$rel/modules.builtin /lib/modules/$rel/modules.dep"
          for m in nf_tables sch_htb cls_flower sch_netem sch_ingress ifb \
                   act_mirred cls_u32 dummy veth vrf wireguard 8021q; do
            if [ -d "/sys/module/$m" ] || grep -qE "(^|/)$m\.ko" $idx 2>/dev/null; then
              continue
            fi
            echo "::warning::module $m unavailable; dependent tests will FAIL (strict mode)"
          done
      - name: Build with lab feature
        shell: bash
        run: cargo build -p nlink --features lab,sockdiag,namespace_watcher --tests
      # STILL INFORMATIONAL, but the reason has changed. The old note
      # here read "39 failures are kernel-behavior assertions that differ
      # between Debian 13 and the old Ubuntu runners (e.g. HTB class
      # counts, address replace label semantics)". Most of them were not:
      # they were real bugs, fixed in #258/#268/#269/#270/#286-#291, and
      # they had been invisible because `has_module` skipped the tests
      # that would have caught them (#273).
      #
      # What is left before this job can gate: #293 and #294 — one real
      # bug (loopback address scope) and one test asserting a label
      # change the kernel does not perform. When those close, drop
      # `continue-on-error` and let a red integration run be red.
      - name: Integration tests (root in container)
        shell: bash
        continue-on-error: true
        env:
          RUST_LOG: nlink=debug
          # A skipped test reports `ok`. On a runner whose modules the
          # guard step just verified, a skip is a bug in the gate, not a
          # missing feature — so make it fail here (#273).
          # The same list the guard step above verifies. Modules not
          # named here (ovpn needs 6.16, wireguard may be absent) still
          # skip.
          NLINK_TEST_STRICT_MODULES: >-
            nf_tables,sch_htb,cls_flower,sch_netem,sch_ingress,ifb,
            act_mirred,cls_u32,dummy,veth,8021q
        run: cargo test -p nlink --features lab,sockdiag,namespace_watcher -- --test-threads=1 --nocapture
      - name: Library tests
        shell: bash
        run: cargo test -p nlink --lib
